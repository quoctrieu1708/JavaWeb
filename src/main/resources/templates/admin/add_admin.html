<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Thêm quản trị viên</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row justify-content-center">
				<div class="col-md-8 p-2">
					<div class="card auth-card" style="max-width: 800px;">
						<div class="card-header text-center">
							<p class="fs-4 text-center mb-0">Thêm quản trị viên</p>
						</div>
						<div class="card-body p-4">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success text-center">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger text-center">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/admin/save-admin" enctype="multipart/form-data" method="post">
								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Họ và tên</label> 
										<input required class="form-control" name="name" type="text" placeholder="Nhập họ và tên">
									</div>

									<div class="col-md-6">
										<label class="form-label fw-bold">Số điện thoại</label> 
										<input required class="form-control" name="mobileNumber" type="text" placeholder="Nhập số điện thoại">
									</div>
								</div>

								<div class="mb-3">
									<label class="form-label fw-bold">Email</label> 
									<input required class="form-control" name="email" type="email" placeholder="Nhập email">
								</div>

								<div class="row mb-3">
									<div class="col-md-12 mb-3">
										<label class="form-label fw-bold">Địa chỉ</label> 
										<input required class="form-control" name="address" type="text" placeholder="Số nhà, Tên đường">
									</div>

									<div class="col-md-4">
										<label class="form-label fw-bold">Tỉnh/Thành phố</label> 
										<input required class="form-control" name="city" type="text">
									</div>
									<div class="col-md-4">
										<label class="form-label fw-bold">Phường/Xã</label> 
										<input required class="form-control" name="state" type="text">
									</div>
									<div class="col-md-4">
										<label class="form-label fw-bold">Mã bưu chính</label> 
										<input required class="form-control" name="pincode" type="number">
									</div>
								</div>

								<div class="row mb-3">
									<div class="col-md-6">
										<label class="form-label fw-bold">Mật khẩu</label> 
										<input required class="form-control" name="password" type="password" placeholder="Nhập mật khẩu">
									</div>

									<div class="col-md-6">
										<label class="form-label fw-bold">Xác nhận mật khẩu</label> 
										<input required class="form-control" name="cpassword" type="password" placeholder="Nhập lại mật khẩu">
									</div>
								</div>

								<div class="mb-4">
									<label class="form-label fw-bold">Ảnh đại diện</label> 
									<input class="form-control" name="img" type="file" accept="image/*">
								</div>

								<button type="submit" class="btn btn-primary w-100 py-2 fs-5">Thêm quản trị viên</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
