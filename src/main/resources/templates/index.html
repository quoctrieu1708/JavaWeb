<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Ecom Store</title>
</head>
<body>
	<section>
		<!-- Start Slider  -->
		<div id="carouselExample" class="carousel slide">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="/img/ecom1.png" class="d-block w-100" alt="..." height="350px">
				</div>
				<div class="carousel-item">
					<img src="/img/ecom3.jpg" class="d-block w-100" alt="..." height="350px">
				</div>
				<div class="carousel-item">
					<img src="/img/ecom2.jpg" class="d-block w-100" alt="..." height="350px">
				</div>
			</div>
			<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Trước</span>
			</button>
			<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Tiếp</span>
			</button>
		</div>
		<!-- End Slider  -->

		<!-- Start Category Module -->
		<div class="container mt-5">
			<div class="row">
				<p class="text-center fs-4 fw-bold">Danh mục nổi bật</p>
				<div class="col-md-2 mb-4" th:each="c:${category}">
					<div class="card category-card p-3 bg-body-tertiary">
						<div class="card-body text-center">
							<img th:src="@{'/img/category_img/'+${c.imageName}}" width="100%" height="140px" style="object-fit: contain;"><br>
							<a th:href="@{'/products?category=' + ${c.encodedName}}" class="text-decoration-none mt-2 d-block fw-bold text-dark">[[${c.name}]]</a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- End Category Module -->

		<!-- Start Latest Product Module -->
		<div class="container-fluid bg-light p-5 mt-4">
			<div class="row">
				<p class="text-center fs-4 fw-bold mb-4">Sản phẩm mới nhất</p>

				<div class="col-md-3 mb-4" th:each="p:${products}">
					<div class="card product-card h-100 bg-white">
						<div class="card-body text-center d-flex flex-column">
							<div class="mt-2 mb-3">
							    <img alt="" th:src="@{'/img/product_img/'+${p.image}}" class="img-fluid" style="height: 180px; object-fit: contain;">
							</div>
							<p class="text-center mb-2 flex-grow-1"><a th:href="@{'/product/'+${p.id}}" class="text-decoration-none text-dark fw-bold fs-5">[[${p.title}]]</a></p>
                            <p class="price-discount mb-0">[[${#numbers.formatDecimal(p.discountPrice, 0, 'POINT', 0, 'COMMA')}]]đ</p>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- End Latest Product Module -->
	</section>
</body>
</html>
