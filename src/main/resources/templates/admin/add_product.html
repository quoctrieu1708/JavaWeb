<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Thêm sản phẩm</title>
</head>
<body>
	<section>
		<div class="container p-5 mt-3">
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card card-sh">
						<div class="card-header text-center bg-primary text-white">
							<p class="fs-4 mb-0 fw-bold">Thêm sản phẩm</p>
						</div>
						<div class="card-body p-4">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success text-center">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger text-center">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/admin/saveProduct" method="post" enctype="multipart/form-data">
								<div class="mb-3">
									<label class="fw-bold form-label">Nhập tên sản phẩm</label> 
									<input type="text" name="title" class="form-control" required placeholder="Tên sản phẩm">
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label">Nhập mô tả</label>
									<textarea rows="3" class="form-control" name="description" placeholder="Mô tả chi tiết sản phẩm"></textarea>
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label">Danh mục</label> 
									<select class="form-select" name="category" required>
										<option value="">--Chọn danh mục--</option>
										<option th:each="c:${categories}" th:value="${c.name}">[[${c.name}]]</option>
									</select>
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label">Nhập đơn giá (VNĐ)</label> 
									<input type="number" name="price" class="form-control" required placeholder="Ví dụ: 100000">
								</div>
								
								<div class="mb-3">
									<label class="fw-bold form-label">Trạng thái</label>
									<div class="d-flex gap-3 mt-2">
										<div class="form-check">
											<input class="form-check-input" type="radio" checked value="true" name="isActive" id="flexRadioDefault1">
											<label class="form-check-label" for="flexRadioDefault1">Hoạt động</label>
										</div>
										<div class="form-check">
											<input class="form-check-input" type="radio" name="isActive" value="false" id="flexRadioDefault2"> 
											<label class="form-check-label" for="flexRadioDefault2">Ẩn</label>
										</div>
									</div>
								</div>
								
								<div class="row">
									<div class="mb-3 col">
										<label class="fw-bold form-label">Số lượng trong kho</label> 
										<input type="number" name="stock" class="form-control" required placeholder="Ví dụ: 100">
									</div>

									<div class="mb-3 col">
										<label class="fw-bold form-label">Tải lên hình ảnh</label> 
										<input type="file" name="file" class="form-control" required accept="image/*">
									</div>
								</div>
								<button class="btn btn-primary w-100 mt-3 py-2 fs-5">Lưu sản phẩm</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
