<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Hồ sơ của tôi</title>
</head>
<body>
	<section>
		<div class="container-fluid mt-5 p-5 bg-light">
			<div class="row">
				<div class="col-md-10 offset-md-1">
					<div class="card shadow-sm border-0 mb-5">
						<div class="card-header bg-white text-center py-3">
							<p class="fs-3 fw-bold text-primary mb-0">Hồ sơ của tôi</p>
						</div>
						<div class="card-body p-4">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success text-center">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger text-center">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
							
							<div class="text-center mb-4">
								<img alt="" th:src="@{'/img/profile_img/'+${user.profileImage}}" class="border border-3 border-primary shadow-sm" style="width: 130px; height: 130px; border-radius: 50%; object-fit: cover;">
							</div>
							
							<div class="col-md-8 offset-md-2">
								<form action="/admin/update-profile" method="post" enctype="multipart/form-data">
									<input type="hidden" th:value="${user.id}" name="id">
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Họ và tên</label>
										<div class="col-sm-9">
											<input type="text" name="name" class="form-control" th:value="${user.name}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Số điện thoại</label>
										<div class="col-sm-9">
											<input type="text" name="mobileNumber" class="form-control" th:value="${user.mobileNumber}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Email</label>
										<div class="col-sm-9">
											<input type="email" class="form-control bg-light" readonly th:value="${user.email}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Địa chỉ</label>
										<div class="col-sm-9">
											<input type="text" name="address" class="form-control" th:value="${user.address}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Tỉnh/Thành phố</label>
										<div class="col-sm-9">
											<input type="text" name="city" class="form-control" th:value="${user.city}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Phường/Xã</label>
										<div class="col-sm-9">
											<input type="text" name="state" class="form-control" th:value="${user.state}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Mã bưu chính</label>
										<div class="col-sm-9">
											<input type="text" name="pincode" class="form-control" th:value="${user.pincode}">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Ảnh đại diện</label>
										<div class="col-sm-9">
											<input type="file" name="img" class="form-control" accept="image/*">
										</div>
									</div>
									
									<div class="row mb-3">
										<label class="col-sm-3 col-form-label fw-bold">Vai trò</label>
										<div class="col-sm-9">
											<input type="text" class="form-control bg-light" readonly th:value="${user.role}">
										</div>
									</div>
									
									<div class="row mb-4">
										<label class="col-sm-3 col-form-label fw-bold">Trạng thái</label>
										<div class="col-sm-9">
											<input type="text" class="form-control bg-light text-success fw-bold" readonly th:if="${user.isEnable}" value="Đang hoạt động">
											<input type="text" class="form-control bg-light text-danger fw-bold" readonly th:unless="${user.isEnable}" value="Đã khóa">
										</div>
									</div>
									
									<div class="text-center mt-4">
										<button class="btn btn-primary px-5 py-2 fw-bold">Cập nhật hồ sơ</button>
									</div>
								</form>
							</div>
						</div>
					</div>

					<div class="card shadow-sm border-0">
						<div class="card-header bg-white text-center py-3">
							<p class="fs-3 fw-bold text-primary mb-0">Đổi mật khẩu</p>
						</div>
						<div class="card-body p-4">
							<div class="col-md-8 offset-md-2">
								<form action="/admin/change-password" method="post">
									<div class="row mb-3">
										<label class="col-sm-4 col-form-label fw-bold">Mật khẩu hiện tại</label>
										<div class="col-sm-8">
											<input type="password" name="currentPassword" class="form-control" required placeholder="Nhập mật khẩu hiện tại">
										</div>
									</div>

									<div class="row mb-3">
										<label class="col-sm-4 col-form-label fw-bold">Mật khẩu mới</label>
										<div class="col-sm-8">
											<input type="password" name="newPassword" class="form-control" required placeholder="Nhập mật khẩu mới">
										</div>
									</div>

									<div class="row mb-4">
										<label class="col-sm-4 col-form-label fw-bold">Xác nhận mật khẩu mới</label>
										<div class="col-sm-8">
											<input type="password" name="confirmPassword" class="form-control" required placeholder="Nhập lại mật khẩu mới">
										</div>
									</div>
									
									<div class="text-center">
										<button class="btn btn-primary px-5 py-2 fw-bold">Đổi mật khẩu</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
