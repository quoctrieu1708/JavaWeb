<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin_base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Chỉnh sửa sản phẩm — E-COMMERCE</title>
</head>
<body>
	<section class="mt-4 pt-2 pb-5">
		<div class="container px-lg-4">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
						<div class="card-header py-3 text-white d-flex justify-content-between align-items-center" style="background: var(--dark-gradient); border-bottom: 2px solid var(--gold-primary);">
							<h5 class="mb-0 fw-bold"><i class="fa-solid fa-pen-to-square text-warning me-2"></i>CHỈNH SỬA SẢN PHẨM</h5>
							<a href="/admin/products" class="btn btn-outline-light btn-sm rounded-pill px-3">
								<i class="fa-solid fa-arrow-left me-1"></i>Danh sách sản phẩm
							</a>
						</div>
						<div class="card-body p-4 p-md-5">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success text-center">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger text-center">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/admin/updateProduct" method="post" enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${product.id}">
								
								<div class="mb-3">
									<label class="fw-bold form-label">Tên sản phẩm</label> 
									<input type="text" name="title" th:value="${product.title}" class="form-control" required>
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label">Mô tả</label>
									<textarea rows="4" class="form-control" name="description" required>[[${product.description}]]</textarea>
								</div>
								
								<div class="row">
									<div class="mb-3 col-md-6">
										<label class="fw-bold form-label">Danh mục</label> 
										<select class="form-select" name="category" required>
											<option th:value="${product.category}">[[${product.category}]]</option>
											<option th:each="c:${categories}" th:value="${c.name}">[[${c.name}]]</option>
										</select>
									</div>
									<div class="mb-3 col-md-6">
										<label class="fw-bold form-label">Giá gốc (VNĐ)</label> 
										<input type="number" name="price" th:value="${product.price}" class="form-control" required>
									</div>
								</div>

								<div class="row">
									<div class="mb-3 col-md-6">
										<label class="fw-bold form-label">Giảm giá (%)</label> 
										<input type="number" name="discount" th:value="${product.discount}" class="form-control" required>
									</div>
									<div class="mb-3 col-md-6">
										<label class="fw-bold form-label">Giá bán thực tế (VNĐ)</label> 
										<input type="number" readonly th:value="${product.discountPrice}" class="form-control bg-light">
										<small class="text-secondary">Tự động tính dựa trên giá gốc và % giảm giá</small>
									</div>
								</div>

								<div class="mb-4">
									<label class="fw-bold form-label">Trạng thái</label>
									<div class="d-flex gap-3 mt-2">
										<div class="form-check">
											<input class="form-check-input" type="radio" th:checked="${product.isActive==true}" value="true" name="isActive" id="flexRadioDefault1">
											<label class="form-check-label" for="flexRadioDefault1">Hoạt động</label>
										</div>
										<div class="form-check">
											<input class="form-check-input" type="radio" name="isActive" th:checked="${product.isActive==false}" value="false" id="flexRadioDefault2"> 
											<label class="form-check-label" for="flexRadioDefault2">Ẩn</label>
										</div>
									</div>
								</div>

								<div class="row align-items-center">
									<div class="mb-3 col-md-5">
										<label class="fw-bold form-label">Số lượng trong kho</label> 
										<input type="number" name="stock" th:value="${product.stock}" class="form-control" required>
									</div>

									<div class="mb-3 col-md-5">
										<label class="fw-bold form-label">Cập nhật hình ảnh (tùy chọn)</label> 
										<input type="file" name="file" class="form-control" accept="image/*">
									</div>

									<div class="col-md-2 text-center mt-2">
                                        <p class="small text-secondary mb-1">Ảnh hiện tại</p>
										<img th:src="@{'/img/product_img/'+${product.image}}" width="80px" height="80px" class="rounded shadow-sm" style="object-fit: cover;">
									</div>
								</div>
								
								<div class="d-flex gap-2 mt-4">
									<a href="/admin/products" class="btn btn-outline-secondary w-50 py-2 fs-6 fw-bold rounded-pill">Hủy</a>
									<button class="btn btn-gold w-50 py-2 fs-6 fw-bold shadow"><i class="fa-solid fa-floppy-disk me-1"></i>Cập nhật sản phẩm</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
