<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Đăng nhập</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row justify-content-center">
				<div class="col-md-6 mt-3">
					<div class="card auth-card">
						<div class="card-header">
							<p class="fs-4 text-center mb-0">Đăng nhập</p>
						</div>
						<div class="card-body p-4">
							<div th:if="${param.error}" class="alert alert-danger text-center">
								<th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION!=null}">
									[[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
								</th:block>
							</div>

							<div th:if="${param.logout}" class="alert alert-success text-center">
								Đăng xuất thành công.
							</div>

							<form action="/login" method="post">
								<div class="mb-3">
									<label class="form-label fw-bold">Email</label> 
									<input required class="form-control" name="username" type="email" placeholder="Nhập email">
								</div>

								<div class="mb-4">
									<label class="form-label fw-bold">Mật khẩu</label> 
									<input required class="form-control" name="password" type="password" placeholder="Nhập mật khẩu">
								</div>
								<button type="submit" class="btn btn-primary w-100 py-2 fs-5">Đăng nhập</button>
							</form>
						</div>

						<div class="card-footer text-center bg-white py-3">
							<a href="/forgot-password" class="text-decoration-none text-secondary">Quên mật khẩu?</a><br><br>
							Chưa có tài khoản? <a href="/register" class="text-decoration-none text-primary fw-bold">Đăng ký ngay</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
