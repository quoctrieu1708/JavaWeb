<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Quản lý danh mục</title>
</head>
<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
				<div class="col-md-4 mb-4">
					<div class="card card-sh border-0 shadow-sm rounded-4 overflow-hidden bg-white">
						<div class="card-header text-center text-white py-3" style="background: var(--dark-gradient); border-bottom: 2px solid var(--gold-primary);">
							<p class="fs-5 mb-0 fw-bold"><i class="fa-solid fa-plus me-1 text-warning"></i>Thêm danh mục mới</p>
						</div>
						<div class="card-body p-4">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success text-center">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger text-center">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/admin/saveCategory" method="post" enctype="multipart/form-data">
								<div class="mb-3">
									<label class="fw-bold form-label small text-secondary">Tên danh mục</label> 
									<input type="text" name="name" class="form-control" required placeholder="Nhập tên danh mục">
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label small text-secondary">Trạng thái</label>
									<div class="d-flex gap-3 mt-2">
										<div class="form-check">
											<input class="form-check-input" type="radio" checked value="true" name="isActive" id="flexRadioDefault1">
											<label class="form-check-label small fw-bold" for="flexRadioDefault1">Hoạt động</label>
										</div>
										<div class="form-check">
											<input class="form-check-input" type="radio" name="isActive" value="false" id="flexRadioDefault2"> 
											<label class="form-check-label small fw-bold" for="flexRadioDefault2">Ẩn</label>
										</div>
									</div>
								</div>

								<div class="mb-4">
									<label class="fw-bold form-label small text-secondary">Hình ảnh đại diện</label> 
									<input type="file" name="file" class="form-control" accept="image/*">
								</div>
								
								<button class="btn btn-gold w-100 py-2 fs-5 fw-bold shadow">
									<i class="fa-solid fa-floppy-disk me-1"></i>Lưu danh mục
								</button>
							</form>
						</div>
					</div>
				</div>

				<div class="col-md-8">
					<div class="card card-sh border-0 shadow-sm rounded-4 overflow-hidden bg-white">
						<div class="card-header text-center fs-5 fw-bold text-white py-3" style="background: var(--dark-gradient); border-bottom: 2px solid var(--gold-primary);">
							<i class="fa-solid fa-layer-group text-warning me-2"></i>Danh sách danh mục hệ thống
						</div>
						<div class="card-body p-4">
							<div class="table-responsive">
								<table class="table table-hover table-bordered align-middle text-center">
									<thead class="bg-light text-secondary text-uppercase small">
										<tr>
											<th scope="col" class="py-3">STT</th>
											<th scope="col" class="py-3">Tên danh mục</th>
											<th scope="col" class="py-3">Trạng thái</th>
											<th scope="col" class="py-3">Hình ảnh</th>
											<th scope="col" class="py-3">Thao tác</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="cat,c:${categorys}">
											<th scope="row">[[${c.count}]]</th>
											<td class="fw-bold">[[${cat.name}]]</td>
											<td>
												<span th:if="${cat.isActive}" class="badge bg-success px-2 py-1">Hoạt động</span>
												<span th:unless="${cat.isActive}" class="badge bg-danger px-2 py-1">Ẩn</span>
											</td>
											<td><img th:src="@{'/img/category_img/'+${cat.imageName}}" width="50px" height="50px" class="rounded shadow-sm" style="object-fit: cover;"></td>
											<td>
												<a th:href="@{'/admin/loadEditCategory/'+${cat.id}}" class="btn btn-primary btn-sm me-2"><i class="fa-solid fa-pen-to-square"></i> Sửa</a> 
												<a th:href="@{'/admin/deleteCategory/'+${cat.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');"><i class="fa-solid fa-trash"></i> Xóa</a>
											</td>
										</tr>
									</tbody>
								</table>
							</div>

							<div class="row align-items-center mt-3">
								<div class="col-md-4 fw-bold text-secondary">Tổng số danh mục: [[${totalElements}]]</div>
								<div class="col-md-8">
									<nav aria-label="Page navigation">
										<ul class="pagination justify-content-end mb-0">
											<li class="page-item" th:classappend="${isFirst} ? 'disabled':''">
												<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo-1}}" aria-label="Previous"> 
													<span aria-hidden="true">&laquo; Trước</span>
												</a>
											</li>

											<li th:each="i:${#numbers.sequence(1,totalPages)}" class="page-item" th:classappend="${pageNo+1==i}?'active':''">
												<a class="page-link" th:href="@{'/admin/category?pageNo='+${i-1}}">[[${i}]]</a>
											</li>

											<li class="page-item" th:classappend="${isLast} ? 'disabled':''">
												<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo+1}}" aria-label="Next"> 
													<span aria-hidden="true">Tiếp &raquo;</span>
												</a>
											</li>
										</ul>
									</nav>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
