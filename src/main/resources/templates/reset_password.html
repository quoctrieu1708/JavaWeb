<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Đặt lại mật khẩu</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row justify-content-center">
				<div class="col-md-6 mt-3">
					<div class="card auth-card">
						<div class="card-header">
							<p class="fs-4 text-center mb-0">Đặt lại mật khẩu</p>
						</div>
						<div class="card-body p-4">
							<th:block th:if="${session.succMsg}">
								<p class="text-success fw-bold text-center alert alert-success">[[${session.succMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<p class="text-danger fw-bold text-center alert alert-danger">[[${session.errorMsg}]]</p>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/reset-password" method="post" id="resetPassword" novalidate>
								<div class="mb-3">
									<label class="form-label fw-bold">Mật khẩu mới</label> 
									<input id="pass" class="form-control" name="password" type="password" placeholder="Nhập mật khẩu mới">
								</div>

								<div class="mb-4">
									<label class="form-label fw-bold">Xác nhận mật khẩu mới</label> 
									<input name="confirmPassword" class="form-control" type="password" placeholder="Nhập lại mật khẩu mới">
								</div>
								
								<input type="hidden" th:value="${token}" name="token">
								
								<button type="submit" class="btn btn-primary w-100 py-2 fs-5">Đặt lại mật khẩu</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
