<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Quên mật khẩu — Ecom Store</title>
</head>
<body>
	<section class="mt-4 pt-2 pb-5">
		<div class="container px-3">
			<div class="row justify-content-center">
				<div class="col-md-7 col-lg-5">
					<div class="card auth-card shadow-lg">
						<!-- Header -->
						<div class="card-header text-center">
							<div class="brand-icon-box mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.25rem;">
								<i class="fa-solid fa-key"></i>
							</div>
							<p>KHÔI PHỤC MẬT KHẨU</p>
							<small>Nhập email đăng ký để nhận liên kết thiết lập lại mật khẩu</small>
						</div>

						<!-- Body -->
						<div class="card-body p-4 p-md-5">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success rounded-3 text-center small mb-4">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger rounded-3 text-center small mb-4">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/forgot-password" method="post">
								<div class="mb-4">
									<label class="form-label fw-bold small text-secondary">Địa chỉ Email của bạn</label> 
									<div class="input-group">
										<span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
										<input required class="form-control" name="email" type="email" placeholder="example@gmail.com" autocomplete="email">
									</div>
								</div>
								
								<button type="submit" class="btn btn-gold w-100 py-3 fs-5 fw-bold shadow">
									<i class="fa-solid fa-paper-plane me-2"></i>Gửi liên kết khôi phục
								</button>
							</form>
						</div>

						<!-- Footer -->
						<div class="card-footer text-center bg-light py-3 border-top small">
							Nhớ lại mật khẩu? <a href="/signin" class="text-decoration-none fw-bold text-dark">Quay lại đăng nhập</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
