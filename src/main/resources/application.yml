server:
  port: ${PORT:8080}

spring:
  main:
    allow-circular-references: true
  config:
    import: "optional:file:./application-local.yml"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce_db_new?useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:false}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    username: ${SPRING_MAIL_USERNAME:yourmail@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp:
        auth: true
        starttls.enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  messages:
    basename: messages
    encoding: UTF-8

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
