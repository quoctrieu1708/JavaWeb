<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Đặt lại mật khẩu — E-COMMERCE</title>
</head>
<body>
	<section class="mt-4 pt-2 pb-5">
		<div class="container px-3">
			<div class="row justify-content-center">
				<div class="col-md-7 col-lg-5">
					<div class="card auth-card shadow-lg">
						<div class="card-header text-center">
							<div class="brand-icon-box mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.25rem;">
								<i class="fa-solid fa-shield-halved"></i>
							</div>
							<p>THIẾT LẬP MẬT KHẨU MỚI</p>
							<small>Cập nhật mật khẩu bảo mật cho tài khoản E-COMMERCE</small>
						</div>
						<div class="card-body p-4 p-md-5">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success rounded-3 text-center small mb-4">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger rounded-3 text-center small mb-4">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/reset-password" method="post" id="resetPassword" novalidate>
								<div class="mb-3">
									<label class="form-label fw-bold small text-secondary">Mật khẩu mới</label>
									<input id="pass" class="form-control" name="password" type="password" placeholder="Nhập mật khẩu mới">
								</div>

								<div class="mb-4">
									<label class="form-label fw-bold small text-secondary">Xác nhận mật khẩu mới</label>
									<input name="confirmPassword" class="form-control" type="password" placeholder="Nhập lại mật khẩu mới">
								</div>

								<input type="hidden" th:value="${token}" name="token">

								<button type="submit" class="btn btn-gold w-100 py-3 fs-6 fw-bold shadow">
									<i class="fa-solid fa-check-double me-2"></i>Xác nhận đổi mật khẩu
								</button>
							</form>
						</div>
						<div class="card-footer text-center bg-light py-3 border-top small">
							<a href="/signin" class="text-decoration-none fw-bold text-dark"><i class="fa-solid fa-arrow-left me-1"></i>Quay lại đăng nhập</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
