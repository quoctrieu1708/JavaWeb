<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin_base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Hồ sơ Quản trị viên — E-COMMERCE</title>
</head>
<body>
	<section class="mt-4 pt-2 pb-5">
		<div class="container px-lg-4">
			<div class="ds-page-header mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
				<div class="d-flex align-items-center gap-3">
					<img alt="Avatar" th:src="@{'/img/profile_img/'+${user.profileImage}}"
						 class="shadow" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold-primary);">
					<div>
						<span class="ds-badge-gold mb-1 d-inline-block"><i class="fa-solid fa-user-shield me-1"></i>QUẢN TRỊ VIÊN E-COMMERCE</span>
						<h4 class="fw-bold mb-0 text-white ds-headline">[[${user.name}]]</h4>
						<small class="text-white-50">[[${user.email}]]</small>
					</div>
				</div>
				<a href="/admin/" class="btn btn-outline-light btn-sm rounded-pill px-3">
					<i class="fa-solid fa-arrow-left me-1"></i>Về Bảng điều khiển
				</a>
			</div>

			<th:block th:if="${session.succMsg}">
				<div class="alert alert-success text-center rounded-4 mb-4">[[${session.succMsg}]]</div>
				<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
			</th:block>

			<th:block th:if="${session.errorMsg}">
				<div class="alert alert-danger text-center rounded-4 mb-4">[[${session.errorMsg}]]</div>
				<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
			</th:block>

			<div class="row g-4">
				<div class="col-lg-7">
					<div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white h-100">
						<div class="card-header py-3 text-white" style="background: var(--dark-gradient); border-bottom: 2px solid var(--gold-primary);">
							<h5 class="mb-0 fw-bold"><i class="fa-solid fa-id-card text-warning me-2"></i>Thông tin Quản trị viên</h5>
						</div>
						<div class="card-body p-4 p-md-5">
							<form action="/admin/update-profile" method="post" enctype="multipart/form-data">
								<input type="hidden" th:value="${user.id}" name="id">
								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Họ và tên</label>
									<div class="col-sm-9">
										<input type="text" name="name" class="form-control" th:value="${user.name}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Số điện thoại</label>
									<div class="col-sm-9">
										<input type="text" name="mobileNumber" class="form-control" th:value="${user.mobileNumber}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Email</label>
									<div class="col-sm-9">
										<input type="email" class="form-control bg-light" readonly th:value="${user.email}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Địa chỉ</label>
									<div class="col-sm-9">
										<input type="text" name="address" class="form-control" th:value="${user.address}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Tỉnh/Thành phố</label>
									<div class="col-sm-9">
										<input type="text" name="city" class="form-control" th:value="${user.city}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Phường/Xã</label>
									<div class="col-sm-9">
										<input type="text" name="state" class="form-control" th:value="${user.state}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Mã bưu chính</label>
									<div class="col-sm-9">
										<input type="text" name="pincode" class="form-control" th:value="${user.pincode}">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Ảnh đại diện</label>
									<div class="col-sm-9">
										<input type="file" name="img" class="form-control" accept="image/*">
									</div>
								</div>

								<div class="row mb-3">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Vai trò</label>
									<div class="col-sm-9">
										<input type="text" class="form-control bg-light" readonly th:value="${user.role}">
									</div>
								</div>

								<div class="row mb-4">
									<label class="col-sm-3 col-form-label fw-bold small text-secondary">Trạng thái</label>
									<div class="col-sm-9">
										<input type="text" class="form-control bg-light text-success fw-bold" readonly th:if="${user.isEnable}" value="Đang hoạt động">
										<input type="text" class="form-control bg-light text-danger fw-bold" readonly th:unless="${user.isEnable}" value="Đã khóa">
									</div>
								</div>

								<button class="btn btn-gold w-100 py-3 fw-bold shadow">
									<i class="fa-solid fa-floppy-disk me-2"></i>Cập nhật hồ sơ Quản trị
								</button>
							</form>
						</div>
					</div>
				</div>

				<div class="col-lg-5">
					<div class="card shadow-sm border-0 rounded-4 overflow-hidden bg-white h-100">
						<div class="card-header py-3 text-white" style="background: var(--dark-gradient); border-bottom: 2px solid var(--gold-primary);">
							<h5 class="mb-0 fw-bold"><i class="fa-solid fa-shield-halved text-warning me-2"></i>Đổi mật khẩu Quản trị</h5>
						</div>
						<div class="card-body p-4 p-md-5">
							<form action="/admin/change-password" method="post">
								<div class="mb-3">
									<label class="form-label fw-bold small text-secondary">Mật khẩu hiện tại</label>
									<input type="password" name="currentPassword" class="form-control" required placeholder="Nhập mật khẩu hiện tại">
								</div>

								<div class="mb-3">
									<label class="form-label fw-bold small text-secondary">Mật khẩu mới</label>
									<input type="password" name="newPassword" class="form-control" required placeholder="Nhập mật khẩu mới">
								</div>

								<div class="mb-4">
									<label class="form-label fw-bold small text-secondary">Xác nhận mật khẩu mới</label>
									<input type="password" name="confirmPassword" class="form-control" required placeholder="Nhập lại mật khẩu mới">
								</div>

								<button class="btn btn-dark-gold w-100 py-3 fw-bold">
									<i class="fa-solid fa-rotate me-2"></i>Xác nhận đổi mật khẩu
								</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
