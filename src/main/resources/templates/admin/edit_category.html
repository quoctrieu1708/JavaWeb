<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin_base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Chỉnh sửa danh mục — E-COMMERCE</title>
</head>
<body>
	<section class="mt-4 pt-2 pb-5">
		<div class="container px-lg-4">
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-5">
					<div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
						<div class="card-header py-3 text-center text-white" style="background: var(--dark-gradient); border-bottom: 2px solid var(--gold-primary);">
							<p class="fs-5 mb-0 fw-bold"><i class="fa-solid fa-pen-to-square text-warning me-2"></i>Chỉnh sửa danh mục</p>
						</div>
						<div class="card-body p-4">
							<th:block th:if="${session.succMsg}">
								<div class="alert alert-success text-center">[[${session.succMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMsg}">
								<div class="alert alert-danger text-center">[[${session.errorMsg}]]</div>
								<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<form action="/admin/updateCategory" method="post" enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${category.id}">
								
								<div class="mb-3">
									<label class="fw-bold form-label">Tên danh mục</label> 
									<input type="text" name="name" th:value="${category.name}" class="form-control" required>
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label">Trạng thái</label>
									<div class="d-flex gap-3 mt-2">
										<div class="form-check">
											<input class="form-check-input" type="radio" th:checked="${category.isActive==true}" value="true" name="isActive" id="flexRadioDefault1"> 
											<label class="form-check-label" for="flexRadioDefault1">Hoạt động</label>
										</div>
										<div class="form-check">
											<input class="form-check-input" type="radio" name="isActive" th:checked="${category.isActive==false}" value="false" id="flexRadioDefault2"> 
											<label class="form-check-label" for="flexRadioDefault2">Ẩn</label>
										</div>
									</div>
								</div>

								<div class="mb-3">
									<label class="fw-bold form-label">Cập nhật hình ảnh (tùy chọn)</label> 
									<input type="file" name="file" class="form-control" accept="image/*">
								</div>
								
								<div class="mb-4 text-center">
									<p class="text-secondary small mb-2">Hình ảnh hiện tại</p>
									<img th:src="@{'/img/category_img/'+${category.imageName}}" width="100px" height="100px" class="rounded shadow-sm" style="object-fit: cover;">
								</div>
								
								<button class="btn btn-gold w-100 py-2 fs-6 fw-bold mt-2 shadow"><i class="fa-solid fa-floppy-disk me-1"></i>Cập nhật danh mục</button>
								<a href="/admin/category" class="btn btn-outline-secondary w-100 py-2 mt-2 rounded-pill">Quay lại</a>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
